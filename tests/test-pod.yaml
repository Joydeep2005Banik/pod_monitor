# 1. Healthy, steady application (for basic log tailing and stats)
apiVersion: v1
kind: Pod
metadata:
  name: healthy-app
  labels:
    app: healthy-app
spec:
  containers:
  - name: nginx
    image: nginx:alpine
    resources:
      limits:
        memory: "128Mi"
        cpu: "250m"
---
# 2. Continuous log generator (for testing log parsing, ANSI colors, and stream performance)
apiVersion: v1
kind: Pod
metadata:
  name: log-generator
  labels:
    app: log-generator
spec:
  containers:
  - name: logger
    image: busybox
    resources:
      limits:
        memory: "64Mi"
        cpu: "100m"
    command: ["/bin/sh", "-c"]
    args:
      - |
        i=0
        while true; do
          i=$((i+1))
          echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') INFO Request #$i processed successfully in ${i}ms"
          if [ $((i % 5)) -eq 0 ]; then
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') WARN High memory usage detected: $(( (i * 7) % 100 ))%"
          fi
          if [ $((i % 9)) -eq 0 ]; then
            echo "$(date -u +'%Y-%m-%dT%H:%M:%SZ') ERR Failed to authenticate user_id=$i"
          fi
          sleep 2
        done
---
# 3. Crashing Pod (for testing status fallback, red indicators, and CrashLoopBackOff handling)
apiVersion: v1
kind: Pod
metadata:
  name: crashing-pod
  labels:
    app: crashing-pod
spec:
  containers:
  - name: crasher
    image: busybox
    command: ["/bin/sh", "-c", "echo 'Starting up...'; sleep 5; echo 'Fatal error occurred!'; exit 1"]
---
# 4. CPU Stress Pod (for testing high load, CPU sparklines, and metric spikes)
apiVersion: v1
kind: Pod
metadata:
  name: cpu-stress
  labels:
    app: cpu-stress
spec:
  containers:
  - name: stress
    image: polinux/stress
    command: ["stress"]
    args: ["--cpu", "2"]
    resources:
      limits:
        memory: "100Mi"
        cpu: "1000m"